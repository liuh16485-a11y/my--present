<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>礼品项目 - 在线访问导航</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border-radius: 24px;
      padding: 36px 30px;
      max-width: 480px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(224, 83, 60, 0.15);
      border: 1px solid rgba(224, 83, 60, 0.3);
      color: #fb7185;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      background: linear-gradient(135deg, #e11d48, #d97706);
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.35);
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.5);
    }
    .url-box {
      background: #090d16;
      border: 1px dashed #334155;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      font-family: monospace;
      color: #fbbf24;
      word-break: break-all;
      user-select: all;
      margin-bottom: 20px;
    }
    .tip {
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🎁 礼品综合工坊已上线</div>
    <h1>在线网页访问入口</h1>
    <p>礼品挑选、数量选择与商务/活力风格宣传图生成器</p>

    <a href="https://liuh16485-a11y.github.io/my--present/" target="_blank" class="btn">
      🚀 立即打开在线网址
    </a>

    <div class="url-box">
      https://liuh16485-a11y.github.io/my--present/
    </div>

    <div class="tip">
      <strong>💡 访问提示：</strong><br>
      • 仓库地址：<a href="https://github.com/liuh16485-a11y/my--present" target="_blank" style="color: #38bdf8;">github.com/liuh16485-a11y/my--present</a><br>
      • 若初次打开出现 404，请稍等 1~2 分钟等待 GitHub Pages 首次自动化构建部署完成。
    </div>
  </div>
</body>
</html>
